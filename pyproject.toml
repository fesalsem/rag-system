# pyproject.toml — tooling configuration only.
#
# Runtime dependencies deliberately stay in requirements.txt: Streamlit
# Community Cloud and the Docker build both install from that file, so keeping a
# second dependency list here would just let the two drift apart. This file
# configures pytest and coverage, nothing else.

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
# Measure the whole project, then drop the test tree itself so the numbers
# reflect application code rather than the tests that exercise it.
source = ["."]
branch = true
omit = [
    "tests/*",
    "*/tests/*",
    ".venv/*",
    "*/venv/*",
]

[tool.coverage.report]
omit = [
    "tests/*",
    "*/tests/*",
    ".venv/*",
    "*/venv/*",
]
show_missing = true

# Measured at 80% when this was set (config and ui_helpers 100%,
# document_processor 91%, rag_engine 81%, app.py 57%). The gate sits below the
# measurement on purpose: it is there to catch a drop, not to block an honest
# refactor. The largest remaining gap is app.py's upload and button handling,
# which needs a fake file uploader to exercise.
fail_under = 75
