# Local run:  docker compose up --build
# Then open:  http://localhost:8501
#
# Put GROQ_API_KEY in a .env file next to this file (copy .env.template).
# The :? syntax makes compose stop with a clear message if it is missing.

services:
  intellect:
    build: .
    image: intellect:local
    ports:
      - "8501:8501"
    environment:
      GROQ_API_KEY: "${GROQ_API_KEY:?set GROQ_API_KEY in a .env file beside this compose file}"
      GROQ_MODEL: "${GROQ_MODEL:-openai/gpt-oss-20b}"
    volumes:
      # Embedding model cache, so a restart or rebuild does not re-download the
      # MiniLM model. The model is loaded lazily on the first query, not at
      # start-up.
      #
      # There is deliberately no volume for the FAISS index. Indexing is
      # per session: each session writes its own index under
      # /tmp/faiss_index/<session-id>, and those are not kept across restarts
      # and not shared between users. A volume would only accumulate dead
      # per-session directories, so none is mounted.
      - hf_cache:/app/.cache/huggingface
    restart: unless-stopped

volumes:
  hf_cache:
