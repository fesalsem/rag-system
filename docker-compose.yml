# Local run:  docker compose up --build
# Then open:  http://localhost:8501
#
# Put GROQ_API_KEY in a .env file next to this file (copy .env.template).
# The :? syntax makes compose stop with a clear message if it is missing.

services:
  intellect:
    build: .
    image: intellect:local
    ports:
      - "8501:8501"
    environment:
      GROQ_API_KEY: "${GROQ_API_KEY:?set GROQ_API_KEY in a .env file beside this compose file}"
      GROQ_MODEL: "${GROQ_MODEL:-openai/gpt-oss-20b}"
    volumes:
      # config.py defaults index_path to /tmp/faiss_index, which is ephemeral
      # inside a container. This volume keeps the index across restarts.
      - faiss_index:/tmp/faiss_index
      # Embedding model cache, so a rebuild does not re-download MiniLM.
      - hf_cache:/app/.cache/huggingface
    restart: unless-stopped

volumes:
  faiss_index:
  hf_cache:
